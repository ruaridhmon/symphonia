    <style data-summary-evidence-ui>
.claim-evidence-toolbar {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-wrap: wrap;
  margin: 0 0 1rem;
  padding: .75rem .875rem;
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
  border-radius: .75rem;
  background: color-mix(in srgb, var(--accent) 5%, var(--card));
  font-size: .8rem;
  color: var(--muted-foreground);
}
.claim-evidence-toolbar span { margin-right: auto; }
.claim-evidence-toolbar button {
  min-height: 38px;
  border: 1px solid var(--border);
  border-radius: .5rem;
  background: var(--card);
  color: var(--foreground);
  padding: .4rem .65rem;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.claim-evidence-toolbar button:hover { border-color: var(--accent); color: var(--accent); }
.claim-evidence-toolbar .claim-evidence-edit-toggle {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  color: var(--accent);
}

body.claim-evidence-view-active .ProseMirror { display: none !important; }

.claim-evidence-preview {
  display: grid;
  gap: 1rem;
  color: var(--foreground);
}
.claim-evidence-preview[hidden] { display: none; }
.claim-evidence-preview-title h2 { margin: 0; font-size: 1.35rem; }
.claim-evidence-preview-title p { margin: .25rem 0 0; color: var(--muted-foreground); font-size: .88rem; }

.claim-evidence-claim {
  overflow: hidden;
  border: 1px solid var(--border);
  border-left-width: 5px;
  border-radius: .8rem;
  background: var(--card);
  box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
}
.claim-evidence-claim[data-status="agreement"] { border-left-color: #16a34a; }
.claim-evidence-claim[data-status="uncertain"] { border-left-color: #d97706; }
.claim-evidence-claim[data-status="disagreement"] { border-left-color: #dc2626; }
.claim-evidence-claim-heading {
  padding: .9rem 1rem .7rem;
  font-size: 1rem;
  line-height: 1.45;
}
.claim-evidence-meta {
  padding: 0 1rem .65rem;
  font-size: .9rem;
  line-height: 1.45;
}
.claim-evidence-people { color: var(--foreground); }
.claim-evidence-opposition { color: var(--muted-foreground); }

.claim-evidence-group {
  margin: .2rem .85rem .75rem;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: .65rem;
  background: color-mix(in srgb, var(--muted) 14%, var(--card));
}
.claim-evidence-group--supporting { border-left: 4px solid #16a34a; }
.claim-evidence-group--opposing { border-left: 4px solid #dc2626; }
.claim-evidence-group summary {
  display: flex;
  align-items: center;
  gap: .65rem;
  min-height: 46px;
  padding: .65rem .8rem;
  cursor: pointer;
  font-size: .9rem;
  font-weight: 750;
  list-style: none;
}
.claim-evidence-group summary::-webkit-details-marker { display: none; }
.claim-evidence-group summary::after {
  content: "⌄";
  margin-left: .15rem;
  color: var(--accent);
  font-size: 1.15rem;
}
.claim-evidence-group[open] summary::after { content: "⌃"; }
.claim-evidence-count {
  min-width: 1.55rem;
  margin-left: auto;
  padding: .1rem .42rem;
  border-radius: 999px;
  background: var(--muted);
  color: var(--muted-foreground);
  text-align: center;
  font-size: .75rem;
}

.claim-evidence-cards {
  display: grid;
  gap: .55rem;
  padding: 0 .7rem .7rem;
}
.claim-evidence-card {
  margin: 0;
  padding: .75rem .8rem;
  border: 1px solid var(--border);
  border-radius: .6rem;
  background: var(--background);
}
.claim-evidence-expert {
  margin-bottom: .3rem;
  color: var(--accent);
  font-size: .78rem;
  font-weight: 800;
}
.claim-evidence-quote {
  color: var(--foreground);
  font-size: .9rem;
  line-height: 1.55;
}

@media (max-width: 640px) {
  .claim-evidence-toolbar { align-items: stretch; }
  .claim-evidence-toolbar span { width: 100%; margin: 0 0 .15rem; }
  .claim-evidence-toolbar button { flex: 1; min-width: 0; }
  .claim-evidence-toolbar .claim-evidence-edit-toggle { flex-basis: 100%; }
  .claim-evidence-claim-heading { padding: .8rem .8rem .6rem; }
  .claim-evidence-meta { padding-left: .8rem; padding-right: .8rem; }
  .claim-evidence-group { margin-left: .65rem; margin-right: .65rem; }
  .claim-evidence-card { padding: .7rem; }
}

    </style>
    <script data-summary-evidence-ui>
(function () {
  'use strict';

  var ROOT_SELECTOR = '.ProseMirror';
  var PANEL_CLASS = 'claim-evidence-preview';
  var editing = false;
  var rebuildTimer = 0;

  function text(node) {
    return (node && node.textContent ? node.textContent : '').replace(/\u00a0/g, ' ').trim();
  }

  function evidenceGroup(labelNode, listNode) {
    var kindMatch = text(labelNode).match(/^Show\s+(supporting|opposing)\s+statements$/i);
    if (!kindMatch || !listNode || listNode.tagName !== 'UL') return null;
    var kind = kindMatch[1].toLowerCase();
    var items = Array.prototype.slice.call(listNode.querySelectorAll(':scope > li'));
    if (!items.length) return null;

    var details = document.createElement('details');
    details.className = 'claim-evidence-group claim-evidence-group--' + kind;

    var summary = document.createElement('summary');
    summary.innerHTML = '<span>' + (kind === 'supporting' ? 'Supporting' : 'Opposing') +
      ' expert excerpts</span><span class="claim-evidence-count">' + items.length + '</span>';
    details.appendChild(summary);

    var list = document.createElement('div');
    list.className = 'claim-evidence-cards';
    items.forEach(function (item, index) {
      var card = document.createElement('blockquote');
      card.className = 'claim-evidence-card';
      var raw = text(item);
      var split = raw.match(/^(Response\s+[^:]+):\s*([\s\S]*)$/i);
      var expert = document.createElement('div');
      expert.className = 'claim-evidence-expert';
      expert.textContent = split ? split[1].replace(/^Response\s+/i, '') : 'Expert excerpt ' + (index + 1);
      var quote = document.createElement('div');
      quote.className = 'claim-evidence-quote';
      quote.textContent = split ? split[2] : raw;
      card.appendChild(expert);
      card.appendChild(quote);
      list.appendChild(card);
    });
    details.appendChild(list);
    return details;
  }

  function buildPreview(root) {
    if (!root || !root.parentElement) return;
    var existing = root.parentElement.querySelector(':scope > .' + PANEL_CLASS);
    var toolbar = root.parentElement.querySelector(':scope > .claim-evidence-toolbar');
    if (existing) existing.remove();
    if (toolbar) toolbar.remove();

    var nodes = Array.prototype.slice.call(root.children);
    if (!nodes.some(function (node) { return /^Claims$/i.test(text(node)); })) {
      document.body.classList.remove('claim-evidence-view-active');
      return;
    }

    var preview = document.createElement('section');
    preview.className = PANEL_CLASS;
    preview.setAttribute('aria-label', 'Claims and expert excerpts');

    var title = document.createElement('div');
    title.className = 'claim-evidence-preview-title';
    title.innerHTML = '<h2>Claims</h2><p>Expand a claim’s evidence to inspect the available expert excerpts.</p>';
    preview.appendChild(title);

    for (var i = 0; i < nodes.length; i += 1) {
      var node = nodes[i];
      if (node.tagName !== 'P' || !/^[🟥🟨🟩]\s*Claim\s+\d+:/i.test(text(node))) continue;

      var card = document.createElement('article');
      card.className = 'claim-evidence-claim';
      if (text(node).indexOf('🟥') === 0) card.dataset.status = 'disagreement';
      if (text(node).indexOf('🟨') === 0) card.dataset.status = 'uncertain';
      if (text(node).indexOf('🟩') === 0) card.dataset.status = 'agreement';

      var heading = document.createElement('div');
      heading.className = 'claim-evidence-claim-heading';
      heading.innerHTML = node.innerHTML;
      card.appendChild(heading);

      for (i += 1; i < nodes.length; i += 1) {
        var current = nodes[i];
        if (current.tagName === 'HR' || (current.tagName === 'P' && /^[🟥🟨🟩]\s*Claim\s+\d+:/i.test(text(current)))) {
          if (current.tagName === 'P') i -= 1;
          break;
        }
        if (!text(current)) continue;

        if (current.tagName === 'P' && /^Show\s+(supporting|opposing)\s+statements$/i.test(text(current))) {
          var group = evidenceGroup(current, nodes[i + 1]);
          if (group) {
            card.appendChild(group);
            i += 1;
          }
          continue;
        }

        if (current.tagName === 'P') {
          var meta = document.createElement('div');
          meta.className = /^People making/i.test(text(current))
            ? 'claim-evidence-meta claim-evidence-people'
            : 'claim-evidence-meta claim-evidence-opposition';
          meta.innerHTML = current.innerHTML;
          card.appendChild(meta);
        }
      }
      preview.appendChild(card);
    }

    if (!preview.querySelector('.claim-evidence-claim')) return;

    var controls = document.createElement('div');
    controls.className = 'claim-evidence-toolbar';
    controls.setAttribute('aria-label', 'Expert excerpt controls');

    var note = document.createElement('span');
    note.textContent = 'Expert excerpts are collapsed by default';
    controls.appendChild(note);

    var expand = document.createElement('button');
    expand.type = 'button';
    expand.textContent = 'Expand all';
    expand.addEventListener('click', function () {
      Array.prototype.forEach.call(preview.querySelectorAll('details'), function (details) { details.open = true; });
    });
    controls.appendChild(expand);

    var collapse = document.createElement('button');
    collapse.type = 'button';
    collapse.textContent = 'Collapse all';
    collapse.addEventListener('click', function () {
      Array.prototype.forEach.call(preview.querySelectorAll('details'), function (details) { details.open = false; });
    });
    controls.appendChild(collapse);

    var edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'claim-evidence-edit-toggle';
    edit.textContent = editing ? 'Preview evidence' : 'Edit synthesis text';
    edit.addEventListener('click', function () {
      editing = !editing;
      document.body.classList.toggle('claim-evidence-view-active', !editing);
      preview.hidden = editing;
      edit.textContent = editing ? 'Preview evidence' : 'Edit synthesis text';
    });
    controls.appendChild(edit);

    root.parentElement.insertBefore(controls, root);
    root.parentElement.insertBefore(preview, root);
    document.body.classList.toggle('claim-evidence-view-active', !editing);
    preview.hidden = editing;
  }

  function scan() {
    var root = document.querySelector(ROOT_SELECTOR);
    if (!root) return;
    buildPreview(root);
  }

  var observer = new MutationObserver(function (mutations) {
    if (!mutations.some(function (mutation) {
      return mutation.target.closest && mutation.target.closest(ROOT_SELECTOR);
    })) return;
    window.clearTimeout(rebuildTimer);
    rebuildTimer = window.setTimeout(scan, 120);
  });

  function start() {
    scan();
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();

    </script>

    <!-- Zero-flash theme script: sets data-theme + CSS vars BEFORE first paint -->
    <script>
      ;(function() {
        var STORAGE_KEY = 'symphonia-theme';
        var DEFAULT = 'axiotic-light';
        var VALID = ['axiotic-dark', 'axiotic-light', 'apple'];

        var themes = {
          'axiotic-light': {
            type: 'light',
            vars: {
              '--background':'#ffffff','--foreground':'#0f172a',
              '--card':'#f8faff','--card-foreground':'#0f172a',
              '--card-shadow':'0 1px 3px rgba(37, 99, 235, 0.06), 0 1px 2px rgba(0,0,0,0.04)',
              '--card-shadow-lg':'0 4px 12px rgba(37, 99, 235, 0.12), 0 2px 4px -2px rgba(0,0,0,0.05)',
              '--secondary':'#f1f5f9','--secondary-foreground':'#0f172a',
              '--muted':'#f1f5f9','--muted-foreground':'#64748b',
              '--accent':'#2563eb','--accent-foreground':'#ffffff','--accent-hover':'#1d4ed8',
              '--destructive':'#dc2626','--destructive-foreground':'#ffffff',
              '--success':'#16a34a',
              '--highlight':'#eff6ff','--highlight-foreground':'#1e40af','--highlight-border':'#bfdbfe',
              '--border':'#e2e8f0','--input':'#e2e8f0',
              '--ring':'#2563eb','--radius':'0.5rem',
              '--font-family':"'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            }
          },
          'axiotic-dark': {
            type: 'dark',
            vars: {
              '--background':'#0a0f1e','--foreground':'#f0f4ff',
              '--card':'#0f172a','--card-foreground':'#f0f4ff',
              '--card-shadow':'0 1px 3px 0 rgba(0,0,0,0.3), 0 1px 2px -1px rgba(0,0,0,0.3)',
              '--card-shadow-lg':'0 4px 6px -1px rgba(0,0,0,0.4), 0 2px 4px -2px rgba(0,0,0,0.3)',
              '--secondary':'#1e293b','--secondary-foreground':'#f0f4ff',
              '--muted':'#1e293b','--muted-foreground':'#94a3b8',
              '--accent':'#3b82f6','--accent-foreground':'#ffffff','--accent-hover':'#60a5fa',
              '--destructive':'#ef4444','--destructive-foreground':'#ffffff',
              '--success':'#22c55e',
              '--highlight':'#172554','--highlight-foreground':'#93c5fd','--highlight-border':'#1e3a5f',
              '--border':'#1e293b','--input':'#1e293b',
              '--ring':'#3b82f6','--radius':'0.5rem',
              '--font-family':"'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            }
          },
          'apple': {
            type: 'light',
            vars: {
              '--background':'#f5f5f7','--foreground':'#1d1d1f',
              '--card':'#ffffff','--card-foreground':'#1d1d1f',
              '--card-shadow':'0 1px 3px rgba(0,0,0,0.06)',
              '--card-shadow-lg':'0 4px 6px -1px rgba(0,0,0,0.08)',
              '--secondary':'#f5f5f7','--secondary-foreground':'#1d1d1f',
              '--muted':'#f5f5f7','--muted-foreground':'#86868b',
              '--accent':'#007aff','--accent-foreground':'#ffffff','--accent-hover':'#0056b3',
              '--destructive':'#ff3b30','--destructive-foreground':'#ffffff',
              '--success':'#34c759',
              '--highlight':'#e8f0fe','--highlight-foreground':'#0055d4','--highlight-border':'#a8c8f0',
              '--border':'#d2d2d7','--input':'#d2d2d7',
              '--ring':'#007aff','--radius':'0.625rem',
              '--font-family':"'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif"
            }
          }
        };

        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          var id = (stored && VALID.indexOf(stored) !== -1) ? stored : DEFAULT;
        } catch(e) {
          var id = DEFAULT;
        }

        var t = themes[id];
        var root = document.documentElement;
        root.setAttribute('data-theme', id);

        if (t.type === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }

        var vars = t.vars;
        for (var k in vars) {
          if (vars.hasOwnProperty(k)) {
            root.style.setProperty(k, vars[k]);
          }
        }
      })();
    </script>

  <body>
    <div id="root">
      <!-- Branded loading screen — replaced when React mounts -->
      <style>
        .symphonia-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: var(--background, #ffffff);
          color: var(--foreground, #0f172a);
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          gap: 1.5rem;
          transition: opacity 0.3s ease;
        }
        .symphonia-loader__icon {
          width: 48px;
          height: 48px;
          opacity: 0.85;
        }
        .symphonia-loader__bars {
          display: flex;
          align-items: flex-end;
          gap: 4px;
          height: 28px;
        }
        .symphonia-loader__bar {
          width: 4px;
          border-radius: 2px;
          background: var(--accent, #2563eb);
          animation: symphonia-pulse 1.2s ease-in-out infinite;
        }
        .symphonia-loader__bar:nth-child(1) { height: 12px; animation-delay: 0s; }
        .symphonia-loader__bar:nth-child(2) { height: 20px; animation-delay: 0.15s; }
        .symphonia-loader__bar:nth-child(3) { height: 28px; animation-delay: 0.3s; }
        .symphonia-loader__bar:nth-child(4) { height: 20px; animation-delay: 0.45s; }
        .symphonia-loader__bar:nth-child(5) { height: 12px; animation-delay: 0.6s; }
        @keyframes symphonia-pulse {
          0%, 100% { transform: scaleY(0.4); opacity: 0.4; }
          50% { transform: scaleY(1); opacity: 1; }
        }
        .symphonia-loader__text {
          font-size: 0.8125rem;
          font-weight: 500;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: var(--muted-foreground, #64748b);
          animation: symphonia-fade 2s ease-in-out infinite;
        }
        @keyframes symphonia-fade {
          0%, 100% { opacity: 0.5; }
          50% { opacity: 1; }
        }
      </style>
      <div class="symphonia-loader">
        <img src="/logo-mark.png" alt="" class="symphonia-loader__icon" />
        <div class="symphonia-loader__bars">
          <div class="symphonia-loader__bar"></div>
          <div class="symphonia-loader__bar"></div>
          <div class="symphonia-loader__bar"></div>
          <div class="symphonia-loader__bar"></div>
          <div class="symphonia-loader__bar"></div>
        </div>
        <div class="symphonia-loader__text">Loading Symphonia</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
