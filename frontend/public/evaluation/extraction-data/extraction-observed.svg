  <g id="text_20">
   <text style="font-size: 20px; font-family: 'Arial', sans-serif; text-anchor: start; fill: #26222d" x="86.4" y="60.192" transform="rotate(-0 86.4 60.192)">Faithfulness and coverage of saved extractions</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'Arial', sans-serif; text-anchor: start; fill: #847a91" x="86.4" y="85.5" transform="rotate(-0 86.4 85.5)">1 consultation · 8 opening responses · 2 extraction repeats · provisional review</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'Arial', sans-serif; fill: #625b6b" transform="translate(86.4 563.08)">Filled marker: unresolved card receives no credit (40% coverage; 85.7% faithfulness).</text>
   <text style="font-size: 10px; font-family: 'Arial', sans-serif; fill: #625b6b" transform="translate(86.4 579.08)">Open marker: unresolved card receives credit (46.7%; 100%). Each endpoint represents</text>
   <text style="font-size: 10px; font-family: 'Arial', sans-serif; fill: #625b6b" transform="translate(86.4 595.08)">both repeats. The connecting line is an annotation bound, not a confidence interval.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'Arial', sans-serif; fill: #817989" transform="translate(86.4 626.22)">Core claim content only; expert counts and attribution are not scored here. One assistant</text>
   <text style="font-size: 9px; font-family: 'Arial', sans-serif; fill: #817989" transform="translate(86.4 639.72)">reviewed these labels without blinding. No density estimate from a single consultation.</text>
   <text style="font-size: 9px; font-family: 'Arial', sans-serif; fill: #817989" transform="translate(86.4 653.22)">Both saved outputs hit the 2,500-token cap; this does not isolate unconstrained extraction ability.</text>
  </g>
