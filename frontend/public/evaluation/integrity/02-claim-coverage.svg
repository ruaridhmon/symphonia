  <g id="text_22">
   <text style="font-size: 9px; font-family: 'Arial', sans-serif; fill: #4c6262" transform="translate(9.6525 332.275078)">Same synthetic scenario, two archived workflows. Display outputs: 60 claims (structured), 7 (adapter).</text>
   <text style="font-size: 9px; font-family: 'Arial', sans-serif; fill: #4c6262" transform="translate(9.6525 343.077539)">Accepted display IDs: 40 and 3. These are gate outputs, not independently adjudicated semantic recall.</text>
   <text style="font-size: 9px; font-family: 'Arial', sans-serif; fill: #4c6262" transform="translate(9.6525 353.88)">Extraction, conversion and alignment all contribute; the gate itself can reject valid matches.</text>
