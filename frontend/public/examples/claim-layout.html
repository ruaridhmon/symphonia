<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace layout · Symphonia</title><link rel="stylesheet" href="/examples/example.css"><style>main{max-width:1000px!important;margin:auto;padding:28px 24px}.preview-note{font-size:12px;color:var(--muted-foreground);margin-bottom:20px}.preview-title{font-size:22px;margin-bottom:8px}.preview-width{padding:8px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:16px}.product-summary{min-width:0!important}.product-summary .delphi-insights{margin:0!important;padding:0!important;border:0;background:transparent}@media(max-width:700px){main{padding:24px 12px}}main>aside{margin:10px 0 24px}.summary-disclosure label{display:block;margin-bottom:16px}.summary-disclosure textarea,.summary-disclosure select{display:block;width:100%;border:1px solid var(--border);padding:10px;margin-top:8px}.summary-disclosure p{font-size:12px;color:var(--muted-foreground);margin:12px 0}[hidden]{display:none!important}</style></head><body><main class="product-summary"><h1 class="preview-title">Workspace preview</h1><p class="preview-note">Layout preview · synthetic research example. Excerpts use existing fictional responses to demonstrate the controls.</p><label>Preview surface <select class="preview-width" aria-label="Preview surface"><option value="claims">Claims</option><option value="responses">Responses</option></select></label> <label>Preview width <select class="preview-width" aria-label="Preview width"><option value="1064">Desktop</option><option value="390">390px</option><option value="320">320px</option></select></label></main><script type="module">if(document.querySelector("main"))import("/examples/claim-layout.js");</script><script>document.querySelector('[aria-label="Preview width"]').onchange=e=>{const width=e.target.value;location.href=width==='1064'?'/examples/claim-layout.html':'/examples/claim-layout.html?width='+width};const width=
