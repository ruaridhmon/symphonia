name: Deploy Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale dev deploys
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=develop&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "Deploy Dev" and (.status == "queued" or .status == "in_progress")) | .id' \
          | while read -r run_id; do
              if [ "$run_id" != "$CURRENT_RUN_ID" ]; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              fi
            done

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build current dev frontend
        run: npm run build -- --mode development
        working-directory: frontend

      - name: Prepare Firebase dev config
        run: cp firebase.dev.json firebase.json

      - name: Deploy current build to Firebase dev
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SYMPHONIA_DEV }}
          channelId: live
          projectId: symphonia-dev-488613
          entryPoint: .
