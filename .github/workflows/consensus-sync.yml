# Consensus Library Sync
#
# Optional workflow for maintainers with access to the private consensus repo.
# It is manual-only so public forks/clones do not fail on missing GH_TOKEN.
#
# When the consensus library has changed, this workflow:
#   - Installs the latest version
#   - Checks the optional requirements-consensus.txt path
#   - Opens a PR to bump/verify the dependency

name: Consensus Sync

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: "Sync consensus library"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate consensus access token
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "Missing required secret GH_TOKEN."
            echo "This workflow installs private dependency axiotic-ai/consensus and needs a token with repo read access."
            exit 1
          fi

      - name: Install consensus (latest main)
        run: |
          pip install --upgrade pip
          pip install "consensus @ git+https://x-access-token:${GIT_AUTH_TOKEN}@github.com/axiotic-ai/consensus.git@main"
        env:
          GIT_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"

      - name: Capture installed version
        id: version
        run: |
          VERSION=$(pip show consensus | grep ^Version | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Consensus version: $VERSION"

      - name: Install all backend deps (compatibility check)
        run: |
          sed "s|git+https://github.com/axiotic-ai/consensus.git@symphonia-integration|git+https://x-access-token:${GIT_AUTH_TOKEN}@github.com/axiotic-ai/consensus.git@symphonia-integration|g" \
            backend/requirements-consensus.txt > /tmp/backend-requirements.txt
          pip install -r /tmp/backend-requirements.txt
        env:
          GIT_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"

      - name: Run backend tests with new consensus
        run: |
          pip install pytest pytest-asyncio pytest-timeout
          cd backend && python -m pytest tests/ -v --tb=short -x --timeout=60
        env:
          SYNTHESIS_MODE: mock
          OPENAI_API_KEY: "sk-test-not-a-real-key"

      - name: Check for changes
        id: changes
        run: |
          # Generate a pip freeze snapshot to detect version drift
          pip freeze | grep -i consensus > /tmp/consensus-version.txt
          echo "Consensus pinned: $(cat /tmp/consensus-version.txt)"
          # If tests pass with new consensus, that's the signal.
          # We create a marker file with the version for the PR.
          echo "consensus_version=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "deps: bump consensus to ${{ steps.version.outputs.version }}"
          title: "deps: bump consensus library to ${{ steps.version.outputs.version }}"
          body: |
            Automated consensus library sync.

            **Consensus version:** `${{ steps.version.outputs.version }}`
            **Trigger:** ${{ github.event_name }}

            Backend tests passed with the updated library. ✅
          branch: deps/consensus-sync
          base: develop
          labels: dependencies,automated
          delete-branch: true
